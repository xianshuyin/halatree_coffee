org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Pub-cache plugins live on C: while this project is on D:. Kotlin incremental
# compilation cannot relativize paths across drives.
kotlin.incremental=false
# Do not auto-install SDK packages. The current Android CLI fails while
# updating SDK refs, which hangs or crashes the build.
android.builder.sdkDownload=false
# Keep the pre-AGP-9 android {} DSL.
android.newDsl=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
